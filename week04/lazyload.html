<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Images</title>

    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>

<body>

    <main>
        <h1>Lazy Loading Image Gallery</h1>

        <img src="images/image1.webp"

        <img src="images/image2.webp"

             width="400"
             height="600"

             height="600"

             alt="Person wearing a blue patterned outfit standing on a road with trees in the background"
             width="400"
             height="600"
             loading="lazy">

        <img src="images/image5.webp"
             alt="Person wearing a red outfit standing outdoors with a vehicle visible in the background"
             width="400"
             height="600"
             loading="lazy">

        <img src="images/image6.webp"
             alt="Person wearing a green shirt and denim jacket standing beside a parked vehicle outdoors"
             width="400"
             height="600"
             loading="lazy">
